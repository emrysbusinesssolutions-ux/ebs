name: Deploy EBS website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Prepare artifact
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'functions' ./ _site/
      - name: IndexNow ping (Bing / Yandex)
        run: |
          python3 - <<'PY' > /tmp/indexnow.json
          import json, re
          key = '6326d616e9d8413e68dd7bb5467b34ed'
          urls = re.findall(r'<loc>([^<]+)</loc>', open('sitemap.xml', encoding='utf-8').read())
          print(json.dumps({'host': 'emrys-ebs.pages.dev', 'key': key,
                            'keyLocation': f'https://emrys-ebs.pages.dev/{key}.txt',
                            'urlList': urls}))
          PY
          curl -sS -m 30 -X POST 'https://api.indexnow.org/indexnow'             -H 'Content-Type: application/json' --data-binary @/tmp/indexnow.json || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
